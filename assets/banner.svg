<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgOld" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2118"/>
      <stop offset="100%" stop-color="#4a3826"/>
    </linearGradient>
    <linearGradient id="bgNew" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2a3d"/>
      <stop offset="100%" stop-color="#123a52"/>
    </linearGradient>
    <linearGradient id="scanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffe9b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c887"/>
      <stop offset="100%" stop-color="#a9895a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="#1a140f"/>

  <polygon points="0,0 680,0 620,360 0,360" fill="url(#bgOld)"/>
  <polygon points="680,0 1200,0 1200,360 620,360" fill="url(#bgNew)"/>

  <g opacity="0.35" stroke="#6b5535" stroke-width="1.2">
    <line x1="40" y1="30" x2="90" y2="180"/>
    <line x1="150" y1="10" x2="110" y2="150"/>
    <line x1="300" y1="40" x2="340" y2="200"/>
    <line x1="470" y1="20" x2="430" y2="230"/>
    <line x1="560" y1="60" x2="600" y2="250"/>
  </g>
  <g opacity="0.25" fill="#3a2c1c">
    <circle cx="80" cy="90" r="2.4"/>
    <circle cx="220" cy="260" r="1.8"/>
    <circle cx="380" cy="120" r="2.2"/>
    <circle cx="500" cy="290" r="1.6"/>
    <circle cx="150" cy="310" r="2"/>
    <circle cx="60" cy="220" r="1.5"/>
  </g>
  <path d="M0,300 Q120,270 260,305 T560,300" stroke="#5a4530" stroke-width="1" fill="none" opacity="0.3"/>

  <g opacity="0.9">
    <circle cx="880" cy="90" r="1.6" fill="#bfe3ff"/>
    <circle cx="960" cy="150" r="1.3" fill="#bfe3ff"/>
    <circle cx="1040" cy="70" r="1.8" fill="#dff0ff"/>
    <circle cx="1100" cy="200" r="1.4" fill="#bfe3ff"/>
    <circle cx="760" cy="220" r="1.2" fill="#bfe3ff"/>
    <circle cx="1000" cy="270" r="1.6" fill="#dff0ff"/>
  </g>
  <g stroke="#3d6a86" stroke-width="1" opacity="0.35">
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
    <line x1="620" y1="60" x2="1200" y2="60"/>
    <line x1="620" y1="150" x2="1200" y2="150"/>
    <line x1="620" y1="240" x2="1200" y2="240"/>
  </g>

  <rect x="642" y="0" width="30" height="360" fill="url(#scanGlow)"/>
  <line x1="657" y1="0" x2="657" y2="360" stroke="#fff3cf" stroke-width="2" opacity="0.85"/>

  <g transform="translate(690,120)" opacity="0.9">
    <polygon points="0,15 24,0 24,30" fill="#e8c887"/>
    <polygon points="0,15 -24,0 -24,30" fill="#8fb8d6"/>
  </g>

  <rect x="30" y="18" width="600" height="240" fill="none" stroke="url(#frameGrad)" stroke-width="3" opacity="0.35"/>

  <rect width="1200" height="360" fill="url(#vignette)"/>

  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="72" fill="#fbeed8" textLength="1000" lengthAdjust="spacingAndGlyphs">
    Photo Restoration AI
  </text>

  <text x="60" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#cfe6f2" opacity="0.9" textLength="1040" lengthAdjust="spacingAndGlyphs">
    Reads old photos, processes damage and noise, exports restored images
  </text>
  <text x="60" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#cfe6f2" opacity="0.9">
    — no setup
  </text>
</svg>